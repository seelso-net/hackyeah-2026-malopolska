# ---------------------------------------------------------------------------
# Needs-to-Solutions Platform
# Every value can be overridden with an environment variable (see README).
# ---------------------------------------------------------------------------
quarkus.application.name=needs-platform

# --- Database ---------------------------------------------------------------
# Dev mode: Quarkus Dev Services starts PostgreSQL with pgvector automatically (needs Docker).
# Prod mode: point DB_URL at any PostgreSQL 15+ with the pgvector extension, or give its parts
# (DB_HOST, DB_PORT, DB_NAME) where a platform hands them out separately, as Render does.
quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:needs}}
%prod.quarkus.datasource.username=${DB_USER:postgres}
%prod.quarkus.datasource.password=${DB_PASSWORD:postgres}

# Flyway owns the schema (src/main/resources/db/migration); Hibernate never changes it.
quarkus.flyway.migrate-at-start=true
# DEMO_RESET=true wipes the database at startup and loads the demo data again (replaying the demo)
quarkus.flyway.clean-at-start=${DEMO_RESET:false}
# quarkus dev starts Postgres in Docker for you; this image includes pgvector
quarkus.datasource.devservices.image-name=pgvector/pgvector:pg16
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategySnakeCaseImpl
# jsonb columns use Hibernate's own Jackson mapper, so REST output settings never change stored data
quarkus.hibernate-orm.mapping.format.global=ignore
quarkus.hibernate-orm.log.sql=false

# --- HTTP -------------------------------------------------------------------
# Cloud platforms (Render, Railway, Cloud Run, Heroku) pass the port in PORT
quarkus.http.port=${PORT:8080}
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=/.*/
quarkus.http.limits.max-body-size=25M
# gzip the web app and JSON (the Ionic bundle shrinks from ~1.2 MB to ~260 kB); never the event stream
quarkus.http.enable-compression=true
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=Needs-to-Solutions Platform API
quarkus.smallrye-openapi.info-version=0.1.0

# --- App ----------------------------------------------------------------------
# offline: built-in rules and keyword embeddings, no API key needed.
# llm: any OpenAI-compatible API for structuring, matching, translation, drafting and embeddings.
app.ai.mode=${AI_MODE:offline}
# Demo login: send X-Demo-User: <auth_subject> (or ?as=<auth_subject> for the event stream).
# Replace support/CurrentUser with quarkus-oidc before real residents use it.
app.media.dir=${MEDIA_DIR:data/media}

# Minimum cosine similarity before the app proposes joining a case or using a playbook.
# Keyword embeddings (offline) score lower than real embeddings (llm).
app.matching.offline.min-case-similarity=0.20
app.matching.offline.min-playbook-similarity=0.20
app.matching.llm.min-case-similarity=0.45
app.matching.llm.min-playbook-similarity=0.35

# --- LLM mode (quarkus-langchain4j, OpenAI-compatible) ------------------------
# OpenAI: set OPENAI_API_KEY. Ollama: OPENAI_BASE_URL=http://localhost:11434/v1/, any non-empty key,
# and models you pulled, e.g. CHAT_MODEL=qwen2.5:7b EMBEDDING_MODEL=bge-m3.
# Changing the embedding model is safe: stored vectors are recomputed at the next start.
quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY:not-set}
quarkus.langchain4j.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1/}
quarkus.langchain4j.openai.chat-model.model-name=${CHAT_MODEL:gpt-4o-mini}
quarkus.langchain4j.openai.embedding-model.model-name=${EMBEDDING_MODEL:text-embedding-3-small}
quarkus.langchain4j.openai.timeout=60s
quarkus.langchain4j.openai.chat-model.temperature=0.2
quarkus.langchain4j.openai.log-requests=false
quarkus.langchain4j.openai.log-responses=false
