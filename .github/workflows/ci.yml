# Every push and pull request: test the API, build the app, then run the whole demo against the real
# Docker image (API flow with curl, then every screen in a browser). Pushes to main also publish the
# image to GitHub Packages: ghcr.io/<owner>/<repo>:latest, ready for any container host.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B verify

  app:
    name: App build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build # type-checks first

  e2e:
    name: Demo end to end
    needs: [backend, app]
    runs-on: ubuntu-latest
    env:
      APP_IMAGE: needs-platform:ci
      BASE: http://localhost:8080
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: needs-platform:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the API and PostgreSQL
        run: |
          docker compose up -d --no-build
          scripts/wait-ready.sh
      - name: API flow (scripts/demo-flow.sh)
        run: scripts/demo-flow.sh
      - name: Reload the demo data
        run: |
          docker compose restart app
          scripts/wait-ready.sh
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Every screen, every role (app/e2e/click_through.py)
        run: python app/e2e/click_through.py
        env:
          OUT: e2e-shots
      - name: Links, back and forward (app/e2e/navigation.py)
        run: python app/e2e/navigation.py
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: e2e-shots/
          if-no-files-found: ignore
      - name: API log
        if: failure()
        run: docker compose logs app --tail 300

  publish:
    name: Publish image
    needs: e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
